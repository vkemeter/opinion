name: Publish

# Publishes a release tag (1.2.3 or v1.2.3) to the TYPO3 Extension Repository.
# Needs the repository secret TYPO3_API_TOKEN (extensions.typo3.org → Access tokens).

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  ter:
    name: Publish to TER
    needs: ci
    runs-on: ubuntu-latest
    env:
      TYPO3_API_TOKEN: ${{ secrets.TYPO3_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, json, zip, curl
          tools: composer:v2

      - name: Get version
        run: |
          version="${GITHUB_REF_NAME#v}"
          composerVersion="$(php -r 'echo json_decode(file_get_contents("composer.json"), true)["extra"]["typo3/cms"]["version"] ?? "";')"
          emconfVersion="$(php -r '$_EXTKEY = "opinion"; include "ext_emconf.php"; echo $EM_CONF["opinion"]["version"];')"
          if [[ "$version" != "$composerVersion" || "$version" != "$emconfVersion" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in composer.json ($composerVersion) and ext_emconf.php ($emconfVersion)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"

      - name: Get comment
        run: |
          # actions/checkout does not fetch the annotated tag object
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          comment="$(git tag -l "$GITHUB_REF_NAME" --format '%(contents)')"
          if [[ -z "${comment// }" ]]; then
            comment="Released version $version"
          fi
          {
            echo 'comment<<EOF'
            echo "$comment"
            echo EOF
          } >> "$GITHUB_ENV"

      - name: Export release files
        # git archive honours the export-ignore entries in .gitattributes
        run: |
          mkdir -p "$RUNNER_TEMP/opinion"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/opinion"

      - name: Install tailor
        run: composer global require typo3/tailor --prefer-dist --no-progress

      - name: Publish to TER
        run: |
          "$(composer global config bin-dir --absolute 2>/dev/null)/tailor" ter:publish \
            --path="$RUNNER_TEMP/opinion" --comment="$comment" "$version" opinion
